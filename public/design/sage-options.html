<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sage · Three directions</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080808;color:#eee;font-family:Inter,Arial,sans-serif;-webkit-font-smoothing:antialiased}button,textarea{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible,textarea:focus-visible{outline:2px solid currentColor;outline-offset:5px}button{color:inherit}button:disabled{opacity:.4;cursor:default}
.review{padding:22px 32px;border-bottom:1px solid #303030;display:flex;gap:24px;align-items:center;justify-content:space-between}.review-label{font-size:12px;color:#aaa}.review-label b{display:block;color:#fff;font-size:15px;margin-bottom:5px;font-weight:500}.choices{display:flex;gap:4px;background:#171717;padding:4px;border-radius:12px}.choices button{background:none;border:0;padding:12px 20px;border-radius:8px;font-size:13px;color:#aaa;min-height:44px}.choices button[aria-selected=true]{background:#eee;color:#111}.theme{background:none;border:1px solid #444;border-radius:50%;width:44px;height:44px;font-size:21px}.caption{margin:0;padding:16px 32px;font-size:12px;color:#aaa;display:flex;justify-content:space-between;gap:16px}.caption span:last-child{color:#777}
.app{--bg:#0c0c0c;--fg:#efefef;--muted:#a1a1a1;--line:#292929;--surface:#171717;--solid:#f1f1f1;--inverse:#111;background:var(--bg);color:var(--fg);min-height:760px;height:calc(100dvh - 154px);position:relative;border-top:1px solid #262626;overflow:hidden}.app.light{--bg:#fff;--fg:#111;--muted:#656565;--line:#ddd;--surface:#f3f3f3;--solid:#171717;--inverse:#fff}.top{height:80px;padding:0 38px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{font-size:15px;letter-spacing:-.5px;display:flex;align-items:center;gap:12px}.mark{width:24px;height:24px;border:1px solid var(--fg);border-radius:50%;display:grid;place-items:center;font:18px Georgia,serif}.brand small{color:var(--muted);font-size:12px;letter-spacing:0}.top-actions{display:flex;align-items:center;gap:10px}.quiet{background:none;border:0;font-size:12px;min-height:44px;padding:0 14px;color:var(--muted)}.icon{width:44px;height:44px;border:1px solid var(--line);border-radius:50%;background:none;display:grid;place-items:center}.icon svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.identity{display:flex;align-items:center;gap:10px}.identity i{font-style:normal;border-radius:50%;width:30px;height:30px;display:grid;place-items:center;background:var(--surface);font-size:11px}
.view{height:calc(100% - 80px);position:relative}.conversation{max-width:720px;margin:auto;padding:74px 24px 180px;height:100%;overflow:auto}.eyebrow{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}h1{font-family:Georgia,'Times New Roman',serif;font-weight:400;font-size:48px;line-height:1.15;letter-spacing:-1.7px;margin:20px 0}p{line-height:1.7}.intro{font-size:14px;color:var(--muted);max-width:470px;margin:0}.prompts{display:flex;flex-direction:column;margin-top:42px;align-items:flex-start;gap:6px}.prompt{min-height:44px;background:none;border:0;color:var(--muted);font-size:13px;padding:8px 0;text-align:left}.prompt span{margin-left:18px;color:var(--fg)}.prompt:hover{color:var(--fg)}
.composer-wrap{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:min(720px,100%);padding:16px 24px 22px;background:var(--bg)}.composer{border:1px solid var(--line);border-radius:20px;background:var(--surface);padding:16px 16px 12px}.composer textarea{resize:none;width:100%;background:none;border:0;color:var(--fg);font-size:14px;line-height:1.6;min-height:48px;max-height:100px}.composer textarea::placeholder{color:var(--muted)}.composer-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:4px}.attach{font-size:12px;border:0;background:none;color:var(--muted);min-height:44px;padding:0 4px}.right{display:flex;align-items:center;gap:8px}.send{background:var(--solid);color:var(--inverse);border:0;border-radius:50%;width:40px;height:40px;font-size:22px}.foot{display:flex;justify-content:center;gap:6px;font-size:10px;color:var(--muted);margin-top:14px}.foot button{font-size:10px;color:inherit;border:0;background:none;text-decoration:underline;padding:0}.message{font-size:15px;line-height:1.8;margin-top:30px}.user{border-radius:18px;background:var(--surface);padding:14px 20px;margin-left:70px}.answer{margin-top:32px}.answer b{font-weight:500}.source-button{background:none;border:1px solid var(--line);border-radius:20px;min-height:36px;padding:7px 12px;color:var(--muted);font-size:11px;margin-top:20px}.source-note{font-size:12px;border-left:1px solid var(--line);padding:12px 16px;color:var(--muted);margin-top:14px}.hidden{display:none!important}
.call-view{height:100%;display:flex;align-items:center;flex-direction:column;text-align:center;padding:70px 24px 24px}.call-view h1{font-size:38px;margin:18px 0 10px}.call-view .intro{max-width:360px}.orb{width:176px;height:176px;border-radius:50%;margin:42px 0 32px;background:radial-gradient(circle at 35% 28%,#fff 0%,#bdbdbd 17%,#707070 39%,#303030 67%,#111 85%);box-shadow:inset -12px -10px 28px #0008;position:relative}.orb:after{content:'';position:absolute;inset:12px;border-radius:50%;border:1px solid #ffffff20}.call-status{font-size:13px;color:var(--muted);height:24px}.call-controls{display:flex;gap:16px;margin-top:30px;align-items:center}.call-controls .icon{width:54px;height:54px}.call-controls .primary{width:64px;height:64px;background:var(--solid);color:var(--inverse);border:0}.call-bottom{margin-top:auto;padding-top:32px;color:var(--muted);font-size:11px}.transcript{max-width:390px;font:20px/1.6 Georgia,serif;margin-top:20px}.call-view.active .orb{animation:breathe 3s ease-in-out infinite}@keyframes breathe{50%{transform:scale(1.04);filter:brightness(1.15)}}
.study-layout{display:grid;grid-template-columns:208px 1fr 288px;height:100%}.sidebar{padding:30px 22px;border-right:1px solid var(--line)}.sidebar .new{border:1px solid var(--line);border-radius:8px;padding:12px;min-height:44px;background:none;width:100%;text-align:left;font-size:12px}.sidebar h3{font-size:10px;color:var(--muted);font-weight:400;letter-spacing:1px;margin:35px 0 14px}.history{font-size:12px;color:var(--muted);padding:13px 8px;line-height:1.4}.history.selected{background:var(--surface);border-radius:6px;color:var(--fg)}.study-main{position:relative;min-width:0}.study-main .conversation{padding-top:40px}.study-main h1{font-size:32px;letter-spacing:-.8px}.evidence{border-left:1px solid var(--line);padding:30px 24px}.evidence h2{font-size:13px;font-weight:500;margin:0 0 30px}.evidence article{border-top:1px solid var(--line);padding:22px 0}.evidence small{color:var(--muted);font-size:10px}.evidence h3{font:20px/1.3 Georgia,serif;margin:12px 0}.evidence p{color:var(--muted);font-size:12px}.evidence .tag{font-size:10px;border:1px solid var(--line);padding:5px 8px;border-radius:4px}.toast{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);background:var(--solid);color:var(--inverse);padding:12px 20px;border-radius:10px;font-size:12px;z-index:4;max-width:90%;width:max-content}
@media(min-width:1500px){.conversation{padding-top:100px}.app{min-height:850px}}@media(max-width:1050px){.study-layout{grid-template-columns:170px 1fr}.evidence{display:none}.review{gap:12px}.choices button{padding:12px}}@media(max-width:680px){.review{padding:16px;flex-wrap:wrap}.review-label{flex:1}.choices{order:3;width:100%}.choices button{flex:1;padding:10px 7px}.caption{padding:12px 16px;line-height:1.5}.caption span:last-child{display:none}.app{height:calc(100dvh - 182px);min-height:680px}.top{height:68px;padding:0 20px}.brand small{display:none}.top-actions .quiet{padding:0 8px}.view{height:calc(100% - 68px)}.conversation{padding:50px 24px 190px}h1{font-size:38px}.composer-wrap{padding:14px 16px 18px}.study-layout{display:block}.sidebar{display:none}.study-main{height:100%}.study-main .conversation{padding-top:30px}.call-view{padding-top:40px}.orb{width:144px;height:144px;margin:30px 0}.user{margin-left:28px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="review"><div class="review-label"><b>Sage / Design directions</b>Interactive concepts · sample content</div><div class="choices" role="tablist" aria-label="Design direction"><button role="tab" aria-selected="true" data-view="conversation">01 Conversation</button><button role="tab" aria-selected="false" data-view="call">02 Call</button><button role="tab" aria-selected="false" data-view="study">03 Study</button></div><button class="theme" aria-label="Switch preview to light mode" title="Switch theme">◐</button></header>
<p class="caption"><span id="description">Recommended · A quiet conversation. Everything else is one click away.</span><span>Black by default. White when you want it.</span></p>
<main class="app" id="app">
<nav class="top"><div class="brand"><span class="mark">s</span> summon<span style="color:var(--muted)">/</span><span>Sage</span><small>Founders &amp; David Senra</small></div><div class="top-actions"><button class="quiet" data-action="history">History</button><button class="quiet" data-action="sources">Sources</button><div class="identity"><i>A</i></div></div></nav>
<div class="view" id="view"></div><div id="toast" role="status" class="toast hidden"></div>
</main>
<template id="composer"><div class="composer-wrap"><form class="composer"><textarea aria-label="Your question for Sage" placeholder="What are you working through?" rows="2"></textarea><div class="composer-bottom"><button type="button" class="attach" data-action="context">＋ Add context</button><div class="right"><button type="button" class="icon" data-action="voice" aria-label="Switch to call"><svg viewBox="0 0 24 24"><path d="M8 9v6m4-11v16m4-13v10m4-7v4M4 10v4"/></svg></button><button type="submit" class="send" aria-label="Send question">↑</button></div></div></form><div class="foot">AI guide · Grounded in public sources <span>·</span> <button data-action="disclosure">About Sage</button></div></div></template>
<script>
const view=document.querySelector('#view'), app=document.querySelector('#app');let mode='conversation';
const descriptions={conversation:'Recommended · A quiet conversation. Everything else is one click away.',call:'Voice first · One presence, one conversation. A future voice experience.',study:'Research first · Keep the conversation and its evidence side by side.'};
const icons={mic:'<path d="M9 5a3 3 0 0 1 6 0v7a3 3 0 0 1-6 0zM6 11v1a6 6 0 0 0 12 0v-1M12 18v4m-4 0h8"/>',phone:'<path d="M4 15c4-5 12-5 16 0l-2 3-4-2v-2h-4v2l-4 2z"/>',text:'<path d="M4 5h16v12H9l-5 3zM8 9h8m-8 4h5"/>'};
const icon=(name)=>'<svg viewBox="0 0 24 24">'+icons[name]+'</svg>';
function composer(){return document.querySelector('#composer').innerHTML}
function render(which){mode=which;document.querySelectorAll('[role=tab]').forEach(b=>b.setAttribute('aria-selected',b.dataset.view===which));document.querySelector('#description').textContent=descriptions[which];
if(which==='conversation') view.innerHTML=`<section class="conversation"><div class="welcome"><div class="eyebrow">Your next decision</div><h1>What’s on your mind?</h1><p class="intro">Bring a question, a difficult decision, or a half-formed thought. Let’s work through it.</p><div class="prompts"><button class="prompt">What deserves my focus right now? <span>↗</span></button><button class="prompt">Help me think through a decision <span>↗</span></button><button class="prompt">I’m building something. Where do I start? <span>↗</span></button></div></div><div class="messages" aria-live="polite"></div></section>${composer()}`;
if(which==='call') view.innerHTML=`<section class="call-view"><div class="eyebrow">Sage</div><h1>Room to think out loud.</h1><p class="intro">A conversation at your pace.</p><div class="orb" aria-hidden="true"></div><div class="call-status" role="status">Ready when you are</div><div class="transcript hidden">“What’s the decision you keep coming back to?”</div><div class="call-controls"><button class="icon" data-action="mute" aria-label="Mute" aria-pressed="false">${icon('mic')}</button><button class="icon primary" data-action="start" aria-label="Preview call">${icon('phone')}</button><button class="icon" data-action="captions" aria-label="Toggle captions" aria-pressed="false">${icon('text')}</button></div><button class="quiet" data-action="type" style="margin-top:18px">Type instead</button><div class="call-bottom">Voice concept preview · No microphone access or audio recording</div></section>`;
if(which==='study') view.innerHTML=`<div class="study-layout"><aside class="sidebar"><button class="new" data-action="new">＋ New conversation</button><h3>RECENT</h3><div class="history selected">Choosing what to focus on</div><div class="history">A smaller, better business</div><div class="history">Hiring the first ten people</div><h3>YOUR LIBRARY</h3><div class="history">Saved insights</div><div class="history">Founders episodes</div><div class="history">David Senra interviews</div></aside><section class="study-main"><div class="conversation"><div class="eyebrow">A decision worth getting right</div><h1>Choosing what to focus on</h1><div class="message user">I have three ideas I care about. How do I decide which one deserves the next year?</div><div class="answer message"><b>Start with the tradeoff you’re willing to make.</b><p>A useful first question: which idea would you still choose if you had to say no to the other two?</p><p>Then make the choice smaller. What could you test this week that would change your mind?</p><button class="source-button" data-action="evidence">2 related sources ↗</button><p class="source-note hidden">Sample source suggestions: Steve Jobs on focus; Henry Singleton on choosing among alternatives. This preview is illustrative, not a generated or verified answer.</p></div><div class="messages" aria-live="polite"></div></div>${composer()}</section><aside class="evidence"><h2>Alongside this conversation</h2><span class="eyebrow">Related reading · sample</span><article><small>01 / FOUNDERS</small><h3>Steve Jobs</h3><p>Focus, tradeoffs, and the things you choose not to build.</p><span class="tag">Focus</span></article><article><small>02 / FOUNDERS</small><h3>Henry Singleton</h3><p>Choosing among alternatives rather than following a fixed formula.</p><span class="tag">Judgment</span></article><p style="font-size:11px;color:var(--muted)">Source details open here, keeping your conversation in place.</p></aside></div>`;
}
function toast(text){const t=document.querySelector('#toast');t.textContent=text;t.classList.remove('hidden');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.add('hidden'),4500)}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>render(b.dataset.view));
document.querySelector('.theme').onclick=()=>{const light=app.classList.toggle('light');document.querySelector('.theme').setAttribute('aria-label',light?'Switch preview to dark mode':'Switch preview to light mode')};
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.classList.contains('prompt')){const t=view.querySelector('textarea');t.value=b.textContent.replace('↗','').trim();t.focus()}
const a=b.dataset.action;if(a==='voice')render('call');if(a==='type'||a==='new')render('conversation');if(a==='context')toast('Your life brief from themain.quest would be reviewed and attached here.');if(a==='history')toast('Your recent conversations would open in a drawer.');if(a==='sources')toast('Source search would open here without leaving the conversation.');if(a==='disclosure')toast('Independent AI guide using original public-source syntheses. Not affiliated with Founders Notes.');if(a==='evidence')view.querySelector('.source-note').classList.toggle('hidden');if(a==='start'){const active=view.querySelector('.call-view').classList.toggle('active');view.querySelector('.call-status').textContent=active?'Listening · visual preview':'Ready when you are';b.setAttribute('aria-label',active?'End preview call':'Preview call')};if(a==='mute'){const muted=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',muted);b.style.opacity=muted?'.45':'1';b.setAttribute('aria-label',muted?'Unmute':'Mute')};if(a==='captions'){const t=view.querySelector('.transcript');t.classList.toggle('hidden');b.setAttribute('aria-pressed',!t.classList.contains('hidden'))}});
document.addEventListener('submit',e=>{e.preventDefault();const t=e.target.querySelector('textarea');if(!t?.value.trim())return;view.querySelector('.welcome')?.classList.add('hidden');const messages=view.querySelector('.messages'),user=document.createElement('div');user.className='message user';user.textContent=t.value;messages.append(user);const answer=document.createElement('div');answer.className='answer message';answer.innerHTML='<div class="eyebrow">Sage · sample response</div><p>Let’s make that concrete. What would a good outcome look like, and what makes the decision difficult right now?</p><button class="source-button" data-action="disclosure">About this preview</button>';messages.append(answer);t.value='';answer.scrollIntoView({block:'nearest',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth'})});
render('conversation');
</script>
</body>
</html>
