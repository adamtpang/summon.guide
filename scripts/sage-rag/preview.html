<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sage · Private preview</title>
<link rel="stylesheet" href="/theme"><style>
*{box-sizing:border-box}body{margin:0;background:#080808;color:#eaeaea;font:16px/1.65 system-ui,sans-serif}main{max-width:760px;margin:auto;padding:24px 24px 170px}header{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:#929292}button,textarea{font:inherit}button{cursor:pointer;color:inherit;background:none;border:0;min-height:44px;padding:8px 14px}button:focus-visible,summary:focus-visible{outline:2px solid white;outline-offset:4px}.welcome{text-align:center;margin:13vh 0 70px}.welcome img{width:120px;height:120px;object-fit:contain}.welcome h1{font:36px Georgia,serif;margin:12px 0}.welcome p{color:#858585;font-size:13px}article{margin:32px 0;white-space:pre-wrap;overflow-wrap:anywhere}.user{background:#202020;padding:12px 18px;border-radius:22px;max-width:85%;margin-left:auto;width:fit-content}.assistant{padding:0 2px}.body{white-space:pre-wrap}details{white-space:normal;margin-top:12px;font-size:13px;color:#999}summary{cursor:pointer;padding:8px 0}details a{display:block;color:#bbb;padding:8px 0;text-decoration:none}footer{position:fixed;bottom:0;left:0;right:0;background:linear-gradient(transparent,#080808 20%);padding:25px 20px 20px}form{max-width:712px;display:flex;gap:8px;margin:auto;border:1px solid #333;background:#141414;border-radius:28px;padding:8px}textarea{resize:none;flex:1;min-width:0;max-height:150px;background:none;color:white;border:0;outline:0;padding:10px 14px;line-height:1.5}form button{border-radius:50%;background:#eee;color:#111;width:44px;align-self:flex-end;font-size:24px;line-height:1}form button:disabled{opacity:.3;cursor:default}.note{text-align:center;font-size:11px;color:#737373;margin:10px 0 0}#status{min-height:24px;color:#a0a0a0;font-size:13px;white-space:normal}a:hover{text-decoration:underline}@media(max-width:500px){main{padding:16px 20px 160px}.welcome{margin-top:14vh}.user{max-width:92%}}

body.sage-magic{background-attachment:fixed}header,.welcome p,#status{color:var(--sage-muted)}.welcome h1{color:var(--sage-light);margin-top:20px}.user{background:#13233b;border:1px solid var(--sage-edge)}footer{background:linear-gradient(transparent,var(--sage-night) 20%)}form{background:var(--sage-surface);border-color:var(--sage-edge);box-shadow:0 8px 36px #0003;transition:border-color .2s,box-shadow .2s}form:focus-within{border-color:#6ba9ef;box-shadow:0 0 0 3px #529dff10,0 0 36px #387bdb16}form button{background:var(--sage-blue);color:#071326;box-shadow:0 0 22px #5da5ff22}textarea{color:var(--sage-light)}textarea::placeholder,.note{color:var(--sage-muted)}details a{color:var(--sage-blue)}button:focus-visible,summary:focus-visible{outline-color:var(--sage-blue)}@media(prefers-reduced-motion:reduce){form{transition:none}}
select{color:var(--sage-muted);background:var(--sage-surface);border:1px solid var(--sage-edge);border-radius:12px;padding:10px;min-height:44px;font:inherit;max-width:80%}select:focus-visible{outline:2px solid var(--sage-blue)}.model-badge{display:block;color:var(--sage-muted);font-size:11px;margin-top:10px}</style>
<body class="sage-magic"><main><header><select id="model" aria-label="Sage model"><option value="luna">GPT-5.6 Luna</option></select><button id="new" aria-label="New chat">＋</button></header><div class="welcome" id="welcome"><span class="sage-wizard" role="img" aria-label="Sage the wizard">🧙</span><h1>Sage</h1><p>208 transcripts</p></div><section id="messages" aria-label="Conversation"></section><div id="status" role="status" aria-live="polite"></div></main>
<footer><form id="form"><textarea id="input" rows="1" maxlength="8000" placeholder="What’s on your mind?" aria-label="Message Sage"></textarea><button id="send" aria-label="Send message">↑</button></form><p class="note">Selected passages go to the model provider. Answers can be wrong.</p></footer>
<script>
const input=document.querySelector('#input'),feed=document.querySelector('#messages'),status=document.querySelector('#status'),send=document.querySelector('#send'),fresh=document.querySelector('#new');let history=[],busy=false;const model=document.querySelector("#model");
fetch("/models").then(r=>r.json()).then(data=>{model.replaceChildren(...data.models.map(m=>{const option=document.createElement("option");option.value=m.id;option.textContent=m.label;return option}));model.value=data.defaultModel}).catch(()=>{status.textContent="Model list unavailable. Refresh to retry."});
model.addEventListener("change",()=>{document.querySelector(".note").textContent=model.value==="local"?"Runs on this computer. Experimental answers can be wrong.":"Selected passages go to the model provider. Answers can be wrong."});
function message(role,text,sources=[]){const a=document.createElement('article');a.className=role;const p=document.createElement('div');p.className='body';p.textContent=text;a.append(p);if(sources.length){const d=document.createElement('details'),s=document.createElement('summary');s.textContent=sources.length===1?'Source':sources.length+' sources';d.append(s);for(const source of sources){const link=document.createElement('a');link.textContent=source.id+' · '+source.title+' ↗';link.href=source.url;link.target='_blank';link.rel='noopener noreferrer';d.append(link)}a.append(d)}feed.append(a);return a}
document.querySelector('#form').addEventListener('submit',async e=>{e.preventDefault();const question=input.value.trim();if(!question||busy)return;busy=true;model.disabled=true;send.disabled=true;fresh.disabled=true;input.value='';input.style.height='';document.querySelector('#welcome').hidden=true;const pending=message('user',question);status.textContent='Reading the transcripts…';window.scrollTo(0,document.body.scrollHeight);try{const r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question,history,model:model.value})});const data=await r.json();if(!r.ok)throw new Error(data.error);const answerNode=message('assistant',data.answer,data.sources);const badge=document.createElement('small');badge.className='model-badge';badge.textContent=data.model;answerNode.append(badge);history.push({role:'user',content:question},{role:'assistant',content:data.answer});status.textContent=''}catch(error){pending.remove();input.value=question;status.textContent=error.message}finally{busy=false;model.disabled=false;send.disabled=false;fresh.disabled=false;input.focus();window.scrollTo(0,document.body.scrollHeight)}});
input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();document.querySelector('#form').requestSubmit()}});input.addEventListener('input',()=>{input.style.height='auto';input.style.height=Math.min(input.scrollHeight,150)+'px'});fresh.addEventListener('click',()=>{if(busy)return;history=[];feed.replaceChildren();status.textContent='';document.querySelector('#welcome').hidden=false;input.focus()});
</script></html>
